name: Android Secure Sandbox CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodlarni eng yangi v5 versiya bilan yuklab olish (Node 24 mosligi uchun)
    - name: Checkout Repository
      uses: actions/checkout@v5

    # 2. Java muhitini sozlash
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Gradle fayllarini qidirish va unga ruxsat berish
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          find . -name "gradlew" -exec chmod +x {} \;
        fi

    # 4. APK ilovani avtomat yig'ish (Xato aniq ko'rinishi uchun find qo'shildi)
    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "XATO: gradlew fayli topilmadi! Loyihangizni to'g'ri push qilganingizni tekshiring."
            exit 1
          fi
          DIR_PATH=$(dirname "$GRADLE_PATH")
          cd "$DIR_PATH" && ./gradlew assembleDebug
        fi

    # 5. TAYYOR APK FAYLNI YUKLAB OLISH UCHUN CHIQARISH (Siz so'ragan qism)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Daxilsiz-Suhbat-Sandbox-APK
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
