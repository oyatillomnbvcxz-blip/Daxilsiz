# GitHub Actions - "Daxilsiz Suhbat" Loyihasi uchun Avtomatlashtirish Roboti
name: Daxilsiz Suhbat CI Robot

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Android va Sandbox Kodini Tekshirish
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklab olish (Checkout)
      uses: actions/checkout@v4

    - name: Java muhitini sozlash (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Gradle buyruqlariga ruxsat berish
      run: chmod +x ./gradlew
      continue-on-error: true

    - name: Kod sifatini va xavfsizligini tekshirish (Lint)
      run: ./gradlew lint
      continue-on-error: true

    - name: Xavfsiz APK ilovani yig'ish (Build APK)
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Natijalarni saqlash
      uses: actions/upload-artifact@v4
      with:
        name: daxilsiz-suhbat-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
