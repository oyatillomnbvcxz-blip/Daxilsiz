name: Android Secure Sandbox Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repozitoriyani yuklab olish
    - name: Checkout Repository
      uses: actions/checkout@v5

    # 2. Java 17 muhitini barqaror sozlash
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Barqaror Gradle 8.0 muhitini majburiy o'rnatish (Yangi tizim xatolarini chetlab o'tish)
    - name: Setup Setup Gradle v8.0
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0'

    # 4. Android loyiha strukturasini qatorma-qator to'g'ri yaratish
    - name: Auto Create Android Project Structure
      run: |
        echo "Android loyiha muhiti barqaror formatda tiklanmoqda..."
        
        # Kerakli papkalarni ochish
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/ui
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/sandbox
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/core
        
        # Siz yuklagan fayllarni o'z joylariga nusxalash
        [ -f "ui/SecurityLockActivity.java" ] && cp ui/SecurityLockActivity.java app/src/main/java/com/daxilsiz/suhbat/ui/
        [ -f "sandbox/SecureContainer.java" ] && cp sandbox/SecureContainer.java app/src/main/java/com/daxilsiz/suhbat/sandbox/
        [ -f "core/OfflineCryptoEngine.java" ] && cp core/OfflineCryptoEngine.java app/src/main/java/com/daxilsiz/suhbat/core/
        
        # settings.gradle faylini barqaror ko'rinishda yozish
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Daxilsiz"
        include ':app'
        EOF
        
        # app/build.gradle faylini barqaror versiyada tuzish
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.0.0'
        }
        
        android {
            namespace 'com.daxilsiz.suhbat'
            compileSdk 33
            
            defaultConfig {
                applicationId "com.daxilsiz.suhbat"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        # Manifest faylini yaratish
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <application android:label="Daxilsiz Suhbat">
                <activity android:name=".ui.SecurityLockActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # Mahalliy Wrapper yaratish
        gradle wrapper --gradle-version 8.0

    # 5. APK ilovani yig'ish (Endi xatolik bermaydi)
    - name: Build Android Secure APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug

    # 6. Tayyor APK faylni yuklab olish havolasini chiqarish
    - name: Upload Secure App APK
      uses: actions/upload-artifact@v4
      with:
        name: Daxilsiz-Suhbat-Secure-App
        path: "app/build/outputs/apk/debug/*.apk"
        if-no-files-found: error

