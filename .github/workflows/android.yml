name: Android Secure Sandbox Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repozitoriyani yuklab olish
    - name: Checkout Repository
      uses: actions/checkout@v5

    # 2. Java 17 muhitini barqaror sozlash
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Barqaror Gradle 8.0 muhitini majburiy o'rnatish
    - name: Setup Gradle v8.0
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0'

    # 4. Android loyiha strukturasini avtomat to'g'rilash va yaratish
    - name: Auto Create Android Project Structure
      run: |
        echo "Android loyiha muhiti va paket nomlari avtomat to'g'rilanmoqda..."
        
        # Kerakli papkalarni ochish
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/ui
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/sandbox
        mkdir -p app/src/main/java/com/daxilsiz/suhbat/core
        
        # Fayllarni ko'chirish va ularning ichidagi paket xatolarini avtomat tuzatish (sed buyrug'i bilan)
        if [ -f "ui/SecurityLockActivity.java" ]; then
          echo "package com.daxilsiz.suhbat.ui;" > app/src/main/java/com/daxilsiz/suhbat/ui/SecurityLockActivity.java
          tail -n +2 ui/SecurityLockActivity.java >> app/src/main/java/com/daxilsiz/suhbat/ui/SecurityLockActivity.java
        fi
        
        if [ -f "sandbox/SecureContainer.java" ]; then
          echo "package com.daxilsiz.suhbat.sandbox;" > app/src/main/java/com/daxilsiz/suhbat/sandbox/SecureContainer.java
          tail -n +2 sandbox/SecureContainer.java >> app/src/main/java/com/daxilsiz/suhbat/sandbox/SecureContainer.java
        fi
        
        if [ -f "core/OfflineCryptoEngine.java" ]; then
          echo "package com.daxilsiz.suhbat.core;" > app/src/main/java/com/daxilsiz/suhbat/core/OfflineCryptoEngine.java
          tail -n +2 core/OfflineCryptoEngine.java >> app/src/main/java/com/daxilsiz/suhbat/core/OfflineCryptoEngine.java
        fi
        
        # settings.gradle faylini barqaror ko'rinishda yozish
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Daxilsiz"
        include ':app'
        EOF
        
        # app/build.gradle faylini barqaror versiyada tuzish
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.0.0'
        }
        
        android {
            namespace 'com.daxilsiz.suhbat'
            compileSdk 33
            
            defaultConfig {
                applicationId "com.daxilsiz.suhbat"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        # Manifest faylini to'g'ri standartda yaratish
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.daxilsiz.suhbat">
            <application
                android:allowBackup="true"
                android:label="Daxilsiz Suhbat"
                android:supportsRtl="true">
                <activity 
                    android:name=".ui.SecurityLockActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # Wrapper yaratish
        gradle wrapper --gradle-version 8.0

    # 5. APK ilovani yig'ish (Xatoliksiz yakunlanadi)
    - name: Build Android Secure APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --stacktrace

    # 6. Tayyor APK faylni yuklab olish havolasini chiqarish
    - name: Upload Secure App APK
      uses: actions/upload-artifact@v4
      with:
        name: Daxilsiz-Suhbat-Secure-App
        path: "app/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
